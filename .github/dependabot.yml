version: 2
updates:
  # Keep GitHub Actions current, including actions used by CI and security workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Retain the upstream compatibility exception until the cyclic-PR issue is resolved.
      - dependency-name: "git-town/action"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # NetBird is a Go monorepo with its primary module at the repository root.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/client/internal/metrics/infra/ingest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      golang-x-packages:
        patterns:
          - "golang.org/x/*"
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2/*"
      pion:
        patterns:
          - "github.com/pion/*"
      gorm:
        patterns:
          - "gorm.io/*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      testcontainers:
        patterns:
          - "github.com/testcontainers/testcontainers-go/*"
      wireguard:
        patterns:
          - "golang.zx2c4.com/wireguard*"

  # Track JavaScript/TypeScript dependencies in both frontend applications.
  - package-ecosystem: "npm"
    directories:
      - "/client/ui/frontend"
      - "/proxy/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend:
        patterns:
          - "*"

  # Track Dev Container Features; its Dockerfile is covered separately below.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Cover every verified first-party Docker build context in this repository.
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/client"
      - "/client/internal/metrics/infra/ingest"
      - "/client/ui/build/docker"
      - "/combined"
      - "/e2e/harness"
      - "/management"
      - "/proxy"
      - "/relay"
      - "/signal"
      - "/upload-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      # Preserve the existing upstream exception for the distroless base image.
      - dependency-name: "gcr.io/distroless/base"
      # Preserve upstream Go major/minor policy; patch updates remain eligible.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
