name: IP and Open-Source Supply-Chain Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-evidence:
    name: SBOM and dependency licence evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/sbom.cdx.json
          artifact-name: netbird-cyclonedx-sbom

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: reports/sbom.spdx.json
          artifact-name: netbird-spdx-sbom

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Record Go module graph
        shell: bash
        run: |
          mkdir -p reports
          go version | tee reports/go-version.txt
          go list -m -json all > reports/go-modules.json
          go mod graph > reports/go-module-graph.txt

      - name: Generate Go licence report
        shell: bash
        continue-on-error: true
        run: |
          go install github.com/google/go-licenses@latest
          "$(go env GOPATH)/bin/go-licenses" report ./... > reports/go-licenses.csv

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/ui/frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client/ui/frontend/package.json

      - name: Record frontend dependency tree and licences
        working-directory: client/ui/frontend
        shell: bash
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm list --depth Infinity --json > ../../../reports/frontend-dependency-tree.json
          pnpm dlx license-checker-rseidelsohn --production --json > ../../../reports/frontend-production-licenses.json
          pnpm dlx license-checker-rseidelsohn --json > ../../../reports/frontend-all-licenses.json

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-dependency-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 90

  source-provenance:
    name: Upstream comparison and source licence scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare fork with NetBird upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git fetch --no-tags https://github.com/netbirdio/netbird.git main:refs/remotes/upstream/main
          git log --reverse --format='%H%x09%an%x09%ae%x09%ad%x09%s' --date=iso-strict upstream/main..HEAD > reports/fork-only-commits.tsv
          git diff --stat upstream/main...HEAD > reports/upstream-diff-stat.txt
          git diff --name-status upstream/main...HEAD > reports/upstream-diff-files.tsv
          git diff --binary upstream/main...HEAD -- . ':!go.sum' ':!client/ui/frontend/pnpm-lock.yaml' > reports/fork-only-source.patch
          git log --all --format='%H%x09%an%x09%ae%x09%ad%x09%s' --date=iso-strict > reports/commit-authorship.tsv
          git status --short --branch > reports/working-tree-status.txt

      - name: Scan source for licence and copyright evidence
        shell: bash
        continue-on-error: true
        run: |
          python -m pip install --user scancode-toolkit
          "$HOME/.local/bin/scancode" --license --copyright --package --info --license-text --json-pp reports/scancode.json .

      - name: Collect licence and notice file index
        shell: bash
        run: |
          find . -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'COPYRIGHT*' -o -iname 'PATENTS*' \) \
            -not -path './.git/*' | sort > reports/licence-notice-file-index.txt

      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-source-provenance-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 90
